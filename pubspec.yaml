name: nms_mobile
description: Nutrition Monitoring System - Mobile App for BNS

publish_to: 'none'

version: 1.0.0+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.0

  # Local database (offline)
  sqflite: ^2.3.2
  path: ^1.9.0

  # Secure storage (for token)
  flutter_secure_storage: ^9.0.0

  # State management
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1

  # Connectivity check
  connectivity_plus: ^6.0.3

  # Date picker
  intl: ^0.19.0

  # Shared preferences
  shared_preferences: ^2.2.3

  # UUID for offline local IDs
  uuid: ^4.4.0

  # Password hashing for offline login
  crypto: ^3.0.3

  # File saving (backup download)
  path_provider: ^2.1.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#060D1F"
  adaptive_icon_foreground: assets/images/app_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
